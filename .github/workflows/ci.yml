name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run lint

      - name: Check types
        run: pnpm run check-types -- --filter='@brushy/di*' --filter='@brushy/storage*'

      - name: Check example types
        run: pnpm run check-types:examples

      - name: Test
        run: pnpm run test -- --filter='@brushy/di*' --filter='@brushy/storage*'

      - name: Build
        run: pnpm run build-packages

      - name: Test examples
        run: pnpm run test:examples

      - name: Size limit
        run: pnpm run size-limit --if-present

      - name: Publint
        run: pnpm run publint --if-present

      - name: React Native smoke
        run: node scripts/check-react-native.mjs

      - name: Dependency boundaries
        run: pnpm run check:boundaries --if-present

      - name: Bench smoke
        run: pnpm run bench:quick --if-present
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Validate Mintlify docs
        run: |
          pnpm --filter @brushy/docs run validate
          pnpm --filter @brushy/docs run broken-links
