name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run lint

      - name: Check types
        run: pnpm run check-types

      - name: Check example types
        run: pnpm run check-types:examples

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build-packages

      - name: Test examples
        run: pnpm run test:examples

      - name: Size limit
        run: pnpm run size-limit

      - name: Publint
        run: pnpm run publint

      - name: React Native smoke
        run: node scripts/check-react-native.mjs

      - name: Dependency boundaries
        run: pnpm run check:boundaries

      - name: Bench smoke
        run: pnpm run bench:quick
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Validate Mintlify docs
        run: |
          cd apps/docs
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm run validate
          pnpm run broken-links
